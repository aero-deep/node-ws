<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时间戳生成器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: #333;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            padding: 20px;
            width: 100%;
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.6;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }
        
        .card-title {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            color: #6e8efb;
            font-size: 1.5rem;
        }
        
        .card-title i {
            margin-right: 12px;
            font-size: 1.8rem;
        }
        
        .timestamp-display {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            border: 2px dashed #d1d9e6;
            word-break: break-all;
        }
        
        .timestamp-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #a777e3;
            margin-bottom: 5px;
        }
        
        .timestamp-human {
            font-size: 1.1rem;
            color: #666;
        }
        
        .btn {
            background: linear-gradient(to right, #6e8efb, #a777e3);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
        }
        
        .btn:hover {
            background: linear-gradient(to right, #5a7dfa, #9666d8);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .btn i {
            margin-right: 10px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        
        input, select {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 2px solid #e1e5eb;
            font-size: 1rem;
            transition: border 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #6e8efb;
        }
        
        .result {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            text-align: center;
            font-size: 1.2rem;
            color: #333;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-all;
            border: 2px dashed #d1d9e6;
        }
        
        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            padding: 20px;
            opacity: 0.9;
            font-size: 0.9rem;
            width: 100%;
            max-width: 800px;
        }
        
        .footer a {
            color: white;
            text-decoration: underline;
        }
        
        .copy-btn {
            background: #4CAF50;
            margin-left: 10px;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        
        .copy-btn:hover {
            background: #3d8b40;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .subtitle {
                font-size: 1rem;
            }
            
            .card {
                padding: 20px;
            }
            
            .timestamp-value {
                font-size: 1.5rem;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 15px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .card-title {
                font-size: 1.3rem;
            }
            
            .btn {
                padding: 12px 15px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>时间戳生成器</h1>
            <p class="subtitle">轻松生成、转换和计算时间戳。支持秒级和毫秒级时间戳，在Unix时间戳和人类可读日期时间之间进行双向转换。</p>
        </header>
        
        <main class="main-content">
            <!-- 当前时间戳卡片 -->
            <div class="card">
                <div class="card-title">
                    <i class="fas fa-clock"></i>
                    <h2>当前时间戳</h2>
                </div>
                <div class="timestamp-display">
                    <div class="timestamp-value" id="currentTimestamp">加载中...</div>
                    <div class="timestamp-human" id="currentHumanTime"></div>
                </div>
                <button class="btn" id="generateTimestamp">
                    <i class="fas fa-sync-alt"></i> 生成当前时间戳
                </button>
                <button class="btn copy-btn" id="copyCurrentTimestamp">
                    <i class="far fa-copy"></i> 复制时间戳
                </button>
            </div>
            
            <!-- 时间戳转换卡片 -->
            <div class="card">
                <div class="card-title">
                    <i class="fas fa-exchange-alt"></i>
                    <h2>时间戳转换</h2>
                </div>
                <div class="input-group">
                    <label for="timestampInput">输入时间戳：</label>
                    <input type="text" id="timestampInput" placeholder="例如：1622505600 或 1622505600000">
                </div>
                <div class="input-group">
                    <label for="timestampUnit">时间戳单位：</label>
                    <select id="timestampUnit">
                        <option value="seconds">秒（10位）</option>
                        <option value="milliseconds">毫秒（13位）</option>
                    </select>
                </div>
                <button class="btn" id="convertTimestamp">
                    <i class="fas fa-calculator"></i> 转换为日期时间
                </button>
                <div class="result" id="conversionResult"></div>
            </div>
            
            <!-- 自定义时间戳卡片 -->
            <div class="card">
                <div class="card-title">
                    <i class="fas fa-calendar-alt"></i>
                    <h2>自定义时间戳</h2>
                </div>
                <div class="input-group">
                    <label for="dateInput">选择日期和时间：</label>
                    <input type="datetime-local" id="dateInput">
                </div>
                <div class="input-group">
                    <label for="outputUnit">输出时间戳单位：</label>
                    <select id="outputUnit">
                        <option value="seconds">秒（10位）</option>
                        <option value="milliseconds">毫秒（13位）</option>
                    </select>
                </div>
                <button class="btn" id="generateCustomTimestamp">
                    <i class="fas fa-code"></i> 生成时间戳
                </button>
                <div class="result" id="customTimestampResult"></div>
            </div>
        </main>
        
        <footer class="footer">
            <p>时间戳生成器 &copy; 2023 | 时间戳是从1970年1月1日（UTC）起经过的秒数/毫秒数</p>
            <p>所有时间计算均基于您设备的本地时区（<span id="timezone"></span>）</p>
        </footer>
    </div>

    <script>
        // 获取DOM元素
        const currentTimestampEl = document.getElementById('currentTimestamp');
        const currentHumanTimeEl = document.getElementById('currentHumanTime');
        const generateTimestampBtn = document.getElementById('generateTimestamp');
        const copyCurrentTimestampBtn = document.getElementById('copyCurrentTimestamp');
        const timestampInput = document.getElementById('timestampInput');
        const timestampUnit = document.getElementById('timestampUnit');
        const convertTimestampBtn = document.getElementById('convertTimestamp');
        const conversionResult = document.getElementById('conversionResult');
        const dateInput = document.getElementById('dateInput');
        const outputUnit = document.getElementById('outputUnit');
        const generateCustomTimestampBtn = document.getElementById('generateCustomTimestamp');
        const customTimestampResult = document.getElementById('customTimestampResult');
        const timezoneEl = document.getElementById('timezone');
        
        // 初始化函数
        function init() {
            // 显示当前时区
            timezoneEl.textContent = Intl.DateTimeFormat().resolvedOptions().timeZone;
            
            // 设置日期时间输入为当前时间
            const now = new Date();
            const localDateTime = formatDateTimeLocal(now);
            dateInput.value = localDateTime;
            
            // 更新当前时间戳
            updateCurrentTimestamp();
            
            // 开始实时更新当前时间戳
            setInterval(updateCurrentTimestamp, 1000);
            
            // 设置事件监听器
            setupEventListeners();
        }
        
        // 设置所有事件监听器
        function setupEventListeners() {
            // 生成当前时间戳按钮
            generateTimestampBtn.addEventListener('click', updateCurrentTimestamp);
            
            // 复制当前时间戳按钮
            copyCurrentTimestampBtn.addEventListener('click', () => {
                copyToClipboard(currentTimestampEl.textContent);
                showCopyFeedback(copyCurrentTimestampBtn);
            });
            
            // 转换时间戳按钮
            convertTimestampBtn.addEventListener('click', convertTimestamp);
            
            // 为时间戳输入框添加回车键支持
            timestampInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    convertTimestamp();
                }
            });
            
            // 生成自定义时间戳按钮
            generateCustomTimestampBtn.addEventListener('click', generateCustomTimestamp);
            
            // 为日期时间输入框添加回车键支持
            dateInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    generateCustomTimestamp();
                }
            });
        }
        
        // 更新当前时间戳显示
        function updateCurrentTimestamp() {
            const now = new Date();
            const timestampInSeconds = Math.floor(now.getTime() / 1000);
            const timestampInMilliseconds = now.getTime();
            
            // 显示时间戳（默认显示秒）
            currentTimestampEl.textContent = timestampInSeconds;
            
            // 显示人类可读时间
            const humanTime = formatDateTime(now);
            currentHumanTimeEl.textContent = humanTime;
        }
        
        // 转换时间戳为人类可读日期时间
        function convertTimestamp() {
            const timestampStr = timestampInput.value.trim();
            
            if (!timestampStr) {
                conversionResult.textContent = "请输入时间戳";
                conversionResult.style.color = "#e74c3c";
                return;
            }
            
            const timestamp = parseInt(timestampStr);
            
            if (isNaN(timestamp)) {
                conversionResult.textContent = "无效的时间戳格式";
                conversionResult.style.color = "#e74c3c";
                return;
            }
            
            // 根据选择的单位调整时间戳
            let date;
            const unit = timestampUnit.value;
            
            if (unit === 'seconds') {
                // 秒级时间戳（10位）
                if (timestampStr.length < 10 || timestampStr.length > 10) {
                    conversionResult.textContent = "秒级时间戳应为10位数字";
                    conversionResult.style.color = "#e74c3c";
                    return;
                }
                date = new Date(timestamp * 1000);
            } else {
                // 毫秒级时间戳（13位）
                if (timestampStr.length < 13 || timestampStr.length > 13) {
                    conversionResult.textContent = "毫秒级时间戳应为13位数字";
                    conversionResult.style.color = "#e74c3c";
                    return;
                }
                date = new Date(timestamp);
            }
            
            // 检查日期是否有效
            if (isNaN(date.getTime())) {
                conversionResult.textContent = "无效的时间戳值";
                conversionResult.style.color = "#e74c3c";
                return;
            }
            
            // 格式化结果显示
            const formattedDate = formatDateTime(date);
            conversionResult.innerHTML = `
                <div>
                    <div style="font-weight: bold; color: #a777e3; margin-bottom: 5px;">${formattedDate}</div>
                    <div style="font-size: 0.9rem; color: #666;">UTC: ${date.toUTCString()}</div>
                </div>
            `;
            conversionResult.style.color = "#333";
            
            // 添加复制按钮
            const copyBtn = document.createElement('button');
            copyBtn.className = 'copy-btn';
            copyBtn.innerHTML = '<i class="far fa-copy"></i> 复制';
            copyBtn.addEventListener('click', () => {
                copyToClipboard(formattedDate);
                showCopyFeedback(copyBtn);
            });
            
            conversionResult.appendChild(copyBtn);
        }
        
        // 从日期时间生成时间戳
        function generateCustomTimestamp() {
            const dateTimeStr = dateInput.value;
            
            if (!dateTimeStr) {
                customTimestampResult.textContent = "请选择日期和时间";
                customTimestampResult.style.color = "#e74c3c";
                return;
            }
            
            const date = new Date(dateTimeStr);
            
            // 检查日期是否有效
            if (isNaN(date.getTime())) {
                customTimestampResult.textContent = "无效的日期时间";
                customTimestampResult.style.color = "#e74c3c";
                return;
            }
            
            // 根据选择的单位生成时间戳
            const unit = outputUnit.value;
            let timestamp;
            
            if (unit === 'seconds') {
                timestamp = Math.floor(date.getTime() / 1000);
            } else {
                timestamp = date.getTime();
            }
            
            // 显示结果
            customTimestampResult.innerHTML = `
                <div>
                    <div style="font-weight: bold; color: #a777e3; margin-bottom: 5px; font-size: 1.4rem;">${timestamp}</div>
                    <div style="font-size: 1rem; color: #666;">${formatDateTime(date)}</div>
                </div>
            `;
            customTimestampResult.style.color = "#333";
            
            // 添加复制按钮
            const copyBtn = document.createElement('button');
            copyBtn.className = 'copy-btn';
            copyBtn.innerHTML = '<i class="far fa-copy"></i> 复制时间戳';
            copyBtn.addEventListener('click', () => {
                copyToClipboard(timestamp.toString());
                showCopyFeedback(copyBtn);
            });
            
            customTimestampResult.appendChild(copyBtn);
        }
        
        // 格式化日期时间为本地字符串
        function formatDateTime(date) {
            const options = {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false,
                timeZoneName: 'short'
            };
            
            return date.toLocaleString('zh-CN', options);
        }
        
        // 为datetime-local输入格式化日期时间
        function formatDateTimeLocal(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            
            return `${year}-${month}-${day}T${hours}:${minutes}`;
        }
        
        // 复制到剪贴板
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                console.log('已复制到剪贴板: ' + text);
            }).catch(err => {
                console.error('复制失败: ', err);
                // 降级方案
                const textArea = document.createElement('textarea');
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
            });
        }
        
        // 显示复制反馈
        function showCopyFeedback(button) {
            const originalText = button.innerHTML;
            button.innerHTML = '<i class="fas fa-check"></i> 已复制';
            button.style.background = '#2ecc71';
            
            setTimeout(() => {
                button.innerHTML = originalText;
                button.style.background = '';
            }, 2000);
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
